[project]
name = "pygitdatback"
version = "0.1.0"
description = "Quickly add, remove and backup GitHub repositories to a centralised location."
readme = "README.md"

requires-python = ">=3.14, <3.15" # Enforce strict upper bound

dependencies = ["gitpython~=3.2.1", "pyside6-essentials~=6.12.0"]

[project.urls]
Repository = "https://github.com/r0fld4nc3/PyGitDatBack"

[dependency-groups]
dev = ["nuitka~=4.3.1", "pyinstaller~=6.18.0"]
